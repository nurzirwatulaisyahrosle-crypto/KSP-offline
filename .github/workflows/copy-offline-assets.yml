name: Copy approved game assets into offline site
on:
  push:
    paths:
      - '.github/workflows/copy-offline-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout offline repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy static media from public KSP-V2 repository
        run: |
          git clone --depth 1 https://github.com/nurzirwatulaisyahrosle-crypto/KSP-V2.git /tmp/ksp-v2
          mkdir -p assets
          cp -R /tmp/ksp-v2/assets/. assets/
          rm -f assets/audio/.gitkeep assets/map/.gitkeep assets/player/.gitkeep assets/checkpoints/.gitkeep
      - name: Commit standalone assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Assets already current"
          else
            git commit -m "Make all map, avatar and audio assets local for offline use"
            git push
          fi
